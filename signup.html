<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - PakCrafts</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="top-header">
        <div class="logo-area">
            <img src="images/logo.png" class="logo">
            <h2>PakCrafts</h2>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search handmade crafts...">
            <img src="images/search.png" class="search-icon">
        </div>

        <img src="images/cart.png" class="cart-icon">
    </header>


    <!-- SIGNUP FORM SECTION -->
    <div class="form-container">
        <h2>Signup</h2>

        <form id="signupForm">

            <label>Full Name</label>
            <input type="text" id="signupName" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Create a password">

            <label>Confirm Password</label>
            <input type="password" id="signupCPassword" placeholder="Confirm password">

            <button type="submit" class="submit-btn">Create Account</button>

            <p class="form-text">
                Already have an account? 
                <a href="login.html">Login</a>
            </p>

        </form>
    </div>


    <!-- FOOTER -->
    <footer class="footer">
        <h2 class="footer-title">PakCrafts</h2>
        <p class="footer-subtitle">Handmade with Love • Cultural Art • Local Creativity</p>

        <div class="footer-social">
            <div class="circle"><img src="images/facebook-icon.png"></div>
            <div class="circle"><img src="images/instagram-icon.png"></div>
            <div class="circle"><img src="images/youtube-icon.png"></div>
        </div>

        <p class="footer-copy">© 2025 PakCrafts. All Rights Reserved.</p>
    </footer>

    <script src="js/signup.js"></script>
</body>
</html>
