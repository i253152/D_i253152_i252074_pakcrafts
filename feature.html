<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize Product - PakCrafts</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="top-header">
        <div class="logo-area">
            <img src="images/logo.png" class="logo">
            <h2>PakCrafts</h2>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search handmade crafts...">
            <img src="images/search.png" class="search-icon">
        </div>

        <img src="images/cart.png" class="cart-icon">
    </header>

    <!-- CUSTOMIZATION SECTION -->
    <div class="custom-container">
        <h2>Interactive Product Customization</h2>

        <div class="product-preview">
            <img id="productImage" src="images/pot.png" alt="Product Preview">
        </div>

        <div class="custom-options">
            <h3>Choose Color:</h3>
            <button class="color-btn" data-image="images/pot_red.png" style="background-color: red;"></button>
            <button class="color-btn" data-image="images/pot_blue.png" style="background-color: blue;"></button>
            <button class="color-btn" data-image="images/pot_green.png" style="background-color: green;"></button>

            <h3>Choose Style:</h3>
            <button class="style-btn" data-image="images/pot_classic.png">Classic</button>
            <button class="style-btn" data-image="images/pot_modern.png">Modern</button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <h2 class="footer-title">PakCrafts</h2>
        <p class="footer-subtitle">Handmade with Love • Cultural Art • Local Creativity</p>

        <div class="footer-social">
            <div class="circle"><img src="images/facebook-icon.png"></div>
            <div class="circle"><img src="images/instagram-icon.png"></div>
            <div class="circle"><img src="images/youtube-icon.png"></div>
        </div>

        <p class="footer-copy">© 2025 PakCrafts. All Rights Reserved.</p>
    </footer>

    <script src="js/customization.js"></script>
</body>
</html>
