<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - PakCrafts</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="top-header">
        <div class="logo-area">
            <img src="images/logo.png" class="logo">
            <h2>PakCrafts</h2>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search handmade crafts...">
            <img src="images/search.png" class="search-icon">
        </div>

        <img src="images/cart.png" class="cart-icon">
    </header>

    <!-- PAYMENT FORM -->
    <div class="form-container">
        <h2>Payment</h2>

        <form id="paymentForm">
            <label>Cardholder Name</label>
            <input type="text" id="cardName" placeholder="Enter your name">

            <label>Card Number</label>
            <input type="text" id="cardNumber" placeholder="Enter 16-digit card number">

            <label>Expiry (MM/YY)</label>
            <input type="text" id="cardExpiry" placeholder="MM/YY">

            <label>CVV</label>
            <input type="text" id="cardCVV" placeholder="3-digit CVV">

            <button type="submit" class="submit-btn">Pay Now</button>
        </form>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <h2 class="footer-title">PakCrafts</h2>
        <p class="footer-subtitle">Handmade with Love • Cultural Art • Local Creativity</p>

        <div class="footer-social">
            <div class="circle"><img src="images/facebook-icon.png"></div>
            <div class="circle"><img src="images/instagram-icon.png"></div>
            <div class="circle"><img src="images/youtube-icon.png"></div>
        </div>

        <p class="footer-copy">© 2025 PakCrafts. All Rights Reserved.</p>
    </footer>

    <script src="js/payment.js"></script>
</body>
</html>
