<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PakCrafts</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="top-header">
        <div class="logo-area">
            <img src="images/logo.png" class="logo">
            <h2>PakCrafts</h2>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search handmade crafts...">
            <img src="images/search.png" class="search-icon">
        </div>

        <img src="images/cart.png" class="cart-icon">
    </header>

    <!-- CONTACT FORM -->
    <div class="form-container">
        <h2>Contact Us</h2>

        <form id="contactForm">
            <label>Name</label>
            <input type="text" id="contactName" placeholder="Enter your full name">

            <label>Email</label>
            <input type="email" id="contactEmail" placeholder="Enter your email">

            <label>Message</label>
            <textarea id="contactMessage" placeholder="Write your message" rows="5"></textarea>

            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <h2 class="footer-title">PakCrafts</h2>
        <p class="footer-subtitle">Handmade with Love • Cultural Art • Local Creativity</p>

        <div class="footer-social">
            <div class="circle"><img src="images/facebook-icon.png"></div>
            <div class="circle"><img src="images/instagram-icon.png"></div>
            <div class="circle"><img src="images/youtube-icon.png"></div>
        </div>

        <p class="footer-copy">© 2025 PakCrafts. All Rights Reserved.</p>
    </footer>

    <script src="js/contact.js"></script>
</body>
</html>
